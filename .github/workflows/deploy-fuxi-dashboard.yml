name: Deploy FuXi dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "clean/fuxi-dashboard/**"
      - ".github/workflows/deploy-fuxi-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fuxi-dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clean/fuxi-dashboard/package-lock.json

      - name: Stamp deployed commit
        working-directory: clean/fuxi-dashboard
        run: python scripts/stamp_deploy.py --commit "$GITHUB_SHA"

      - name: Validate compact global package
        working-directory: clean/fuxi-dashboard
        run: python scripts/validate_global_web_data.py

      - name: Install frontend dependencies
        working-directory: clean/fuxi-dashboard
        run: npm ci

      - name: Build static site
        working-directory: clean/fuxi-dashboard
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: clean/fuxi-dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
