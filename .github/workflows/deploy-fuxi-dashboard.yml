name: Deploy validated FuXi dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "clean/fuxi-dashboard/**"
      - ".github/workflows/deploy-fuxi-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: fuxi-dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clean/fuxi-dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clean/fuxi-dashboard/package-lock.json

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Stamp deployed commit and public checksums
        run: python scripts/stamp_deploy.py --commit "$GITHUB_SHA"

      - name: Validate current issues and complete archive
        run: python scripts/validate_operational_publication.py --scope all

      - name: Validate pinned global demo package
        run: python scripts/validate_global_web_data.py

      - name: Type-check and build static site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: clean/fuxi-dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out expected catalog
        uses: actions/checkout@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed commit and issue pointers
        working-directory: clean/fuxi-dashboard
        run: >-
          python scripts/postdeploy_smoke.py
          --base-url "${{ steps.deployment.outputs.page_url }}"
          --expected-commit "$GITHUB_SHA"
          --expected-index public/data/index.json
